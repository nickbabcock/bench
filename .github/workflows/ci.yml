name: CI

on:
  pull_request:
  push:
    branches: ['main']
  schedule:
  - cron: '00 01 * * *'

jobs:
  test:
    name: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v4
      with:
        version: 2026.9.17
    - run: rustup target add wasm32-unknown-unknown
    - name: Npm Install
      run: npm ci
    # The Silesia corpus download behind `mise run build:corpus`; the key is
    # the SHA-256 pinned in xtask/src/main.rs.
    - uses: actions/cache@v6
      with:
        path: .cache/corpus
        key: silesia-0626e25f45c0ffb5dc801f13b7c82a3b75743ba07e3a71835a41e3d9f63c77af
    - name: Build app
      run: mise run build
    - run: npm run lint
    - run: npm test

  devcontainer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - run: npm install -g @devcontainers/cli
    - run: devcontainer build --workspace-folder .
