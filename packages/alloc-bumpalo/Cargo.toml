[package]
name = "alloc-bumpalo"
version = "0.1.0"
authors = ["Nick Babcock <nbabcock19@hotmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen.workspace = true
alloc-workload = { path = "../alloc-workload" }
# allocator-api2: `&Bump` implements allocator_api2 0.2's Allocator, so it backs the shared Vec.
bumpalo = { version = "3.20.3", features = ["allocator-api2"] }
