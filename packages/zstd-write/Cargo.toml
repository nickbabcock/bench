[package]
name = "zstd-write"
version = "0.1.0"
authors = ["Nick Babcock <nbabcock19@hotmail.com>"]
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
zstd = { version = "0.14.3", default-features = false }
# Only for ZSTD_getCParams, to report each level's effective parameters.
zstd-sys = { version = "2.1.2", default-features = false, features = ["experimental"] }
wasm-bindgen.workspace = true
