[workspace]
resolver = "2"
members = [
    "packages/alloc",
    "packages/alloc-bumpalo",
    "packages/alloc-bump-scope",
    "packages/alloc-talc",
    "packages/alloc-workload",
    "packages/br-read",
    "packages/br-write",
    "packages/corpus",
    "packages/libdeflate",
    "packages/lz4",
    "packages/memory64",
    "packages/miniz",
    "packages/zlib-rs",
    "packages/zstd-read",
    "packages/zstd-write",
    "packages/zune",
]

[profile.release]
lto = true
codegen-units = 1

[profile.profiling]
inherits = "release"
debug = true

[workspace.dependencies]
wasm-bindgen = { version = "0.2.130" }
# The one Vec every allocation crate uses; bumpalo 3.20 and bump-scope 2.4 both implement its 0.2 Allocator trait.
# "std" matches what bump-scope enables, so building one crate alone (build:variants) gives the same module as the workspace build.
allocator-api2 = { version = "0.2.21", features = ["std"] }
